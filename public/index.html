<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FöreningsFörsäljning</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container { text-align: center; padding: 2rem; max-width: 600px; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .status {
            background: rgba(255,255,255,0.2);
            padding: 1.5rem;
            border-radius: 10px;
            margin: 2rem 0;
        }
        .button {
            display: inline-block;
            background: white;
            color: #667eea;
            padding: 1rem 2rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 FöreningsFörsäljning</h1>
        <p>Sales Organization Management System</p>
        
        <div class="status">
            <h2>✅ Backend API Running!</h2>
        </div>

        <div>
            <a href="/api/health" class="button">Health Check</a>
            <a href="/api/products" class="button">Products API</a>
        </div>

        <div style="margin-top: 2rem; background: rgba(255,255,255,0.1); padding: 1rem; border-radius: 5px;">
            <p><strong>Demo Credentials:</strong></p>
            <p>Admin: admin.stockholm / demo123</p>
            <p>Team: norrmalm / team123</p>
        </div>
    </div>
</body>
</html>
